services:
  ddg-research:
    build:
      context: .
      args:
        PRISM_VERSION: ${PRISM_VERSION:-0.0.0+unknown}
    image: mcp-prism-search:local
    container_name: mcp-prism-search
    restart: unless-stopped
    ports:
      # Loopback only by default; the MCP_AUTH_TOKEN below gates the service.
      - "127.0.0.1:49317:8000"
    volumes:
      # The container runs as uid 10001:10001. On first run, make the bind
      # mount writable by that uid:
      #   mkdir -p ~/docker/docker-data/mcp-prism-search
      #   sudo chown -R 10001:10001 ~/docker/docker-data/mcp-prism-search
      - ~/docker/docker-data/mcp-prism-search:/data
    environment:
      # Required for Docker/LAN HTTP mode. The image defaults to stdio, so
      # compose explicitly enables streamable HTTP and binds inside the container.
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"

      # DuckDuckGo-only search defaults. ddgs can be enabled explicitly; see README.
      SEARCH_PROVIDER: duckduckgo_html
      DDGS_BACKEND: duckduckgo

      # Required. The server refuses to start without a real random token and
      # rejects known placeholders at boot, so provide your own:
      #   MCP_AUTH_TOKEN=$(openssl rand -hex 32) docker compose up -d
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN to a strong random token}

      # Cache pruning defaults for long-running deployments.
      CACHE_PRUNE_ON_START: "true"
      CACHE_PRUNE_INTERVAL_SECONDS: "3600"
      CACHE_MAX_AGE_SECONDS: "604800"
      CACHE_MAX_SIZE_MB: "512"

      # Explicit MCP Host/Origin allowlists. Override for a trusted reverse proxy.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,localhost:49317,127.0.0.1:49317}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:5173}

      # Optional: cache directory inside the container. The mounted /data volume
      # persists this path; the image default is /data/cache.
      # MCP_CACHE_DIR: /data/cache

      # Optional: cache TTLs in seconds.
      # DDG_CACHE_TTL_SECONDS: "21600"
      # FETCH_CACHE_TTL_SECONDS: "7200"

      # Optional: core defaults (blank inherits persisted or built-in values).
      MCP_STATE_DIR: ${MCP_STATE_DIR:-}
      MCP_DISABLED_PROVIDERS: ${MCP_DISABLED_PROVIDERS:-}
      MCP_PREFERRED_PROVIDER: ${MCP_PREFERRED_PROVIDER:-}
      DDG_TIMEOUT_SECONDS: ${DDG_TIMEOUT_SECONDS:-}
      DDG_CACHE_TTL_SECONDS: ${DDG_CACHE_TTL_SECONDS:-}
      FETCH_CACHE_TTL_SECONDS: ${FETCH_CACHE_TTL_SECONDS:-}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-}
      MCP_NEWS_CACHE_TTL_SECONDS: ${MCP_NEWS_CACHE_TTL_SECONDS:-}
      MCP_DEFAULT_SEARCH_MODE: ${MCP_DEFAULT_SEARCH_MODE:-}
      MCP_DEFAULT_SEARCH_PROVIDERS: ${MCP_DEFAULT_SEARCH_PROVIDERS:-}
      MCP_DEFAULT_SEARCH_MAX_RESULTS: ${MCP_DEFAULT_SEARCH_MAX_RESULTS:-}
      MCP_DEFAULT_SEARCH_SAFE_SEARCH: ${MCP_DEFAULT_SEARCH_SAFE_SEARCH:-}
      MCP_DEFAULT_SEARCH_RECENCY: ${MCP_DEFAULT_SEARCH_RECENCY:-}
      MCP_DEFAULT_ALLOWED_DOMAINS: ${MCP_DEFAULT_ALLOWED_DOMAINS:-}
      MCP_DEFAULT_BLOCKED_DOMAINS: ${MCP_DEFAULT_BLOCKED_DOMAINS:-}
      MCP_DEFAULT_PREFERRED_DOMAINS: ${MCP_DEFAULT_PREFERRED_DOMAINS:-}
      MCP_DEFAULT_FETCH_MAX_CHARS: ${MCP_DEFAULT_FETCH_MAX_CHARS:-}
      MCP_DEFAULT_DEEP_MAX_PAGES: ${MCP_DEFAULT_DEEP_MAX_PAGES:-}
      MCP_DEFAULT_VERTICAL_SOURCE: ${MCP_DEFAULT_VERTICAL_SOURCE:-}
      MCP_DEFAULT_VERTICAL_MAX_RESULTS: ${MCP_DEFAULT_VERTICAL_MAX_RESULTS:-}
      MCP_DEFAULT_ANSWER_PROVIDER: ${MCP_DEFAULT_ANSWER_PROVIDER:-}
      MCP_DEFAULT_RESEARCH_PROVIDER: ${MCP_DEFAULT_RESEARCH_PROVIDER:-}
      MCP_DEFAULT_RESEARCH_EFFORT: ${MCP_DEFAULT_RESEARCH_EFFORT:-}

      # Optional: provider-native AI; disabled unless explicitly authorized.
      MCP_AI_SEARCH_ENABLED: ${MCP_AI_SEARCH_ENABLED:-}
      MCP_AI_SEARCH_PROVIDERS: ${MCP_AI_SEARCH_PROVIDERS:-}

      # Optional authenticated provider settings (empty means not configured).
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      YDC_API_KEY: ${YDC_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}

      # Optional: TinyFish TinySearch API key from the host environment.
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}

      # Optional: network timeouts in seconds.
      # DDG_TIMEOUT_SECONDS: "15"
      # FETCH_TIMEOUT_SECONDS: "15"

      # Optional: default deep-search page fetch concurrency, capped at 12.
      # MAX_CONCURRENCY: "5"
