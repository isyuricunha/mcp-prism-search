name: CI and Release

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Retry the latest stable release tag (blank: calculate next release)"
        required: false
        type: string
        default: ""
      image_digest:
        description: "Optional existing multiarch digest to recover a published build (requires tag)"
        required: false
        type: string
        default: ""

# All production releases share one lane, including manual recovery.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('prism-pr-{0}', github.event.pull_request.number) || 'prism-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Preserve the established Docker Hub name for existing installations.
  IMAGE_NAME: mcp-ddg-research
  PYTHON_VERSION: "3.12"
  SEMANTIC_RELEASE_VERSION: "10.7.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    name: Validate exact source and plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      artifact_name: prism-distributions-${{ github.run_attempt }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml

      - name: Plan without mutating remote
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RECOVERY_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            {
              echo "publish=false"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run releases from main only"
            exit 1
          fi
          if [[ -n "$RECOVERY_DIGEST" ]]; then
            [[ -n "$REQUESTED_TAG" && "$RECOVERY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Recovery digest requires an explicit release tag and valid SHA256"
              exit 1
            }
          fi
          python -m venv "$RUNNER_TEMP/semantic-release"
          "$RUNNER_TEMP/semantic-release/bin/pip" install "python-semantic-release==$SEMANTIC_RELEASE_VERSION"
          export PATH="$RUNNER_TEMP/semantic-release/bin:$PATH"
          # Semantic Release requires a named local branch; no branch is pushed.
          git switch -C main "$GITHUB_SHA"
          python scripts/release_plan.py --tag "$REQUESTED_TAG"

      - name: Generate mandatory changelog from exact release history
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          "$RUNNER_TEMP/semantic-release/bin/python" scripts/release_changelog.py \
            "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/prism-release-notes"

      - name: Select planned source
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git switch --detach "$SOURCE_SHA"
          if [[ -n "$RELEASE_VERSION" ]]; then
            test -f scripts/release_guard.py || { echo "::error::Retry is supported for releases produced by this workflow"; exit 1; }
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Install locked test environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install build
          python -m pip check

      - name: Lint, test and compile
        run: |
          python -m ruff check .
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Build and verify Python distributions
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python -m build
          python scripts/verify_distribution.py dist
          if [[ -n "$RELEASE_VERSION" ]]; then
            test "$(python -c 'from importlib.metadata import version; print(version("mcp-prism-search"))')" = "$RELEASE_VERSION"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build and test dashboard
        working-directory: webui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # Retry transient repository/CDN failures, but never skip browser tests.
          for attempt in 1 2 3; do
            if npx playwright-core install --with-deps --only-shell chromium; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
          npm run test:browser

      - name: Docker build and smoke test (non-release)
        if: steps.plan.outputs.publish != 'true'
        run: |
          version=$(python -c 'from importlib.metadata import version; print(version("mcp-prism-search"))')
          docker build --build-arg "PRISM_VERSION=$version" -t prism-ci:test .
          docker run --rm --entrypoint python prism-ci:test -c 'import sys; from mcp_prism_search import __version__; assert __version__ == sys.argv[1]; print(__version__)' "$version"

      - name: Stage required changelog
        if: steps.plan.outputs.publish == 'true'
        run: |
          cp "$RUNNER_TEMP/prism-release-notes/CHANGELOG.md" dist/
          cp "$RUNNER_TEMP/prism-release-notes/release-notes.md" dist/
          test -s dist/CHANGELOG.md && test -s dist/release-notes.md

      - name: Retain verified distributions
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-distributions-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified multiarch release
    needs: validate
    if: needs.validate.outputs.publish == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Check out release workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve current release helper and select validated source
        run: |
          mkdir -p "$RUNNER_TEMP/prism-release-tools"
          cp scripts/publish_release.py scripts/release_plan.py "$RUNNER_TEMP/prism-release-tools/"
          git switch --detach "$SOURCE_SHA"

      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve registry names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "dockerhub=${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the validated commit (no release commit)
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          python scripts/release_guard.py "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Build and push versioned images
        if: inputs.image_digest == ''
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PRISM_VERSION=${{ env.RELEASE_VERSION }}
          tags: |
            ${{ steps.images.outputs.dockerhub }}:${{ env.RELEASE_TAG }}
            ${{ steps.images.outputs.ghcr }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=mcp-prism-search
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Multi-provider MCP search with optional native AI and safe fetching.
          cache-from: type=gha,scope=prism-multiarch
          cache-to: type=gha,scope=prism-multiarch,mode=max

      - name: Resolve build or recovery digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          RECOVERY_DIGEST: ${{ inputs.image_digest }}
        run: |
          digest="${RECOVERY_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify runtime and manifests
        env:
          DOCKERHUB_IMAGE: ${{ steps.images.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools inspect "$image@$DIGEST" --raw | python scripts/verify_manifest.py
            test "$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          done
          index=$(docker buildx imagetools inspect "$GHCR_IMAGE@$DIGEST" --raw)
          for arch in amd64 arm64; do
            # The classic Docker image store cannot associate one index digest
            # with two platform images. Pull each immutable child manifest.
            child=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("Expected one platform manifest") end
            ' <<< "$index")
            [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="$GHCR_IMAGE@$child"
            docker run --rm --platform "linux/$arch" --entrypoint python "$image" \
              -c 'import sys, platform; from mcp_prism_search import __version__; from importlib.metadata import version; assert __version__ == version("mcp-prism-search") == sys.argv[1]; assert platform.machine() == sys.argv[2]; print(__version__, platform.machine())' \
              "$RELEASE_VERSION" "$( [[ "$arch" == amd64 ]] && echo x86_64 || echo aarch64 )"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          done

      - name: Promote verified digest, not mutable build tags
        env:
          DOCKERHUB_IMAGE: ${{ steps.images.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          python scripts/release_guard.py "$RELEASE_TAG" "$SOURCE_SHA" --promote
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create -t "$image:latest" "$image@$DIGEST"
            test "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          done

      - name: Publish GitHub release and missing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/prism-release-tools/publish_release.py" "$RELEASE_TAG" dist
          {
            echo "### Published $RELEASE_TAG"
            echo "Commit: `$SOURCE_SHA`"
            echo "Docker Hub and GHCR: amd64 + arm64, verified version."
          } >> "$GITHUB_STEP_SUMMARY"
