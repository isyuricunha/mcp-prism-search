[build-system]
requires = ["hatchling>=1.33,<2", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-prism-search"
dynamic = ["version"]
description = "MCP search aggregator: multi-provider keyless web search (Bing RSS, DuckDuckGo, SearXNG, FreeSerp, Keenable, Mwmbl) with keyed free-tier providers (TinyFish, Tavily, Exa, Brave, You.com, Serper, Jina), fallback chains, deterministic ranking, caching, and SSRF-safe fetching."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "mcp-prism-search contributors" }
]
dependencies = [
  "beautifulsoup4>=4.12",
  "cryptography>=50,<51",
  "defusedxml>=0.7",
  "ddgs>=9.0",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "packaging>=24",
  "pydantic>=2.7",
  "starlette>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/isyuricunha/mcp-prism-search"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$"
fallback-version = "0.0.0+unknown"

[tool.hatch.version.raw-options]
local_scheme = "node-and-date"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_prism_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.semantic_release]
allow_zero_version = true
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
