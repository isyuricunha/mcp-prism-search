[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-prism-search"
version = "0.13.0"
description = "MCP search aggregator: multi-provider keyless web search (Bing RSS, DuckDuckGo, SearXNG, FreeSerp, Keenable, Mwmbl) with keyed free-tier providers (TinyFish, Tavily, Exa, Brave, You.com, Serper, Jina), fallback chains, deterministic ranking, caching, and SSRF-safe fetching."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "mcp-prism-search contributors" }
]
dependencies = [
  "beautifulsoup4>=4.12",
  "cryptography>=50,<51",
  "defusedxml>=0.7",
  "ddgs>=9.0",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "starlette>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/isyuricunha/mcp-prism-search"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_prism_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mcp_prism_search/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
